<h2 class="transaction-title">Add Transaction</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-grid">
    <!-- Type -->
    <div class="form-row">
      <label>Type</label>
      <select formControlName="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>

    <!-- Category -->
    <div class="form-row">
      <label>Category</label>
      <div class="category-row">
        <select formControlName="category">
          <option value="" disabled>Select Category</option>
          @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
        <button type="button" class="add-cat-btn" (click)="addCategory()">+ Add</button>
      </div>
    </div>
  </div>

  <!-- Description -->
  <div class="form-row">
    <label>Description</label>
    <input formControlName="description" placeholder="Optional" />
  </div>

<!-- Amount breakdown -->
<div class="form-grid">
  <div class="form-row">
    <label>Base Amount (RM)</label>
    <input
      type="number"
      step="0.01"
      min="0"
      placeholder="0"
      formControlName="baseAmount" />
  </div>

  <div class="form-row">
    <label>Tax (%)</label>
    <input
      type="number"
      step="0.01"
      min="0"
      placeholder="0"
      formControlName="taxPercent" />
  </div>
</div>

<div class="form-grid">
  <div class="form-row">
    <label>Other Charges (RM)</label>
    <input
      type="number"
      step="0.01"
      placeholder="0"
      formControlName="otherCharges" />
  </div>

  <div class="form-row">
    <label>Discount (%)</label>
    <input
      type="number"
      step="0.01"
      min="0"
      placeholder="0"
      formControlName="discountPercent" />
  </div>
</div>

<!-- Calculated Amount & Date -->
<div class="form-grid">
  <div class="form-row">
    <label>Total Amount (RM)</label>
    <input
      type="number"
      step="0.01"
      formControlName="amount"
      readonly />
  </div>

<div class="form-row-date">
  <label>Date</label>
  <input type="date" formControlName="date" class="date-input" />
</div>

</div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="submit-btn">
    Add
  </button>
</form>
